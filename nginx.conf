# The tree build.sh made, on 8080. A package is named by its version and never
# changes once published, so it may be cached for good; the indexes, the repo
# file and the keys change with each release, so a cache revalidates them.
server {
    listen 8080;
    root /srv/packages;
    server_tokens off;
    autoindex on;

    location ^~ /deb/pool/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ \.(rpm|apk)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ \.(asc|pub|repo|sources)$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        add_header Cache-Control "no-cache" always;
    }
}
